# cargo-about: third-party notices for the desktop binaries.
#   cargo about generate about.hbs -o THIRD_PARTY_NOTICES.html   (make notices)
# Every licence of a crate in the release dependency graph must be listed; a
# new one fails the build until someone has looked at it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The platforms OPad ships for
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# The workspace's own crates (GPL-3.0-or-later, publish = false) are OPad, not
# third-party; their licence ships as LICENSE
private = { ignore = true }
# Build and dev dependencies are not shipped
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Crates whose licence files need known fix-ups to be read correctly
workarounds = ["ring", "rustls"]
