[package]
name = "opad-update"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util = { workspace = true, optional = true }
chrono.workspace = true
opad-model = { path = "../opad-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"], optional = true }
minisign-verify = "0.2"
sha2 = "0.10"

[features]
default = ["net"]
# The HTTP client. Everything else in this crate is pure logic and builds
# without a TLS stack.
net = ["dep:reqwest", "dep:futures-util"]

[dev-dependencies]
tempfile = "3"
