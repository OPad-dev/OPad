[package]
publish = false
name = "opad-ui-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pixel-exact preview of OPad screen layouts: compiles the firmware's LVGL UI core for the host"

[dependencies]
png = "0.17"
opad-layout = { path = "../opad-layout" }

[dev-dependencies]
opad-model = { path = "../opad-model" }
serde_json.workspace = true

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
