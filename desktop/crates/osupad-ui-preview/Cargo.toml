[package]
name = "osupad-ui-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pixel-exact preview of osu!pad screen layouts: compiles the firmware's LVGL UI core for the host"

[dependencies]
png = "0.17"
osupad-layout = { path = "../osupad-layout" }

[dev-dependencies]
osupad-model = { path = "../osupad-model" }
serde_json.workspace = true

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
