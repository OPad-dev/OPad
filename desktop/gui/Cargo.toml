[package]
name = "osupad-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "osupad-gui"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["image", "canvas"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["color_picker", "number_input"] }
rfd = "0.15"
osupad-layout = { path = "../crates/osupad-layout" }
osupad-ui-preview = { path = "../crates/osupad-ui-preview" }
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
osupad-model = { path = "../crates/osupad-model" }
osupad-ipc = { path = "../crates/osupad-ipc" }
ksni = "0.3"
futures-util = { workspace = true, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[package.metadata.deb]
name = "osupad"
maintainer = "GFerreiroS <info@gferreiro.com>"
copyright = "2026, GFerreiroS <info@gferreiro.com>"
license-file = ["../../LICENSE", "4"]
extended-description = "Low-latency ESP32-S3 keypad manager, telemetry HUD, and tray applet for osu!"
section = "games"
priority = "optional"
depends = "$auto, libvulkan1, libwayland-client0, libx11-6, libxcursor1, libxkbcommon0, libxi6, libdbus-1-3"
maintainer-scripts = "../../packaging/linux/deb"
assets = [
    ["../target/release/osupad-daemon", "usr/bin/osupad-daemon", "755"],
    ["../target/release/osupad-gui", "usr/bin/osupad-gui", "755"],
    ["../target/release/osupadctl", "usr/bin/osupadctl", "755"],
    ["../../packaging/linux/systemd-user/osupad-daemon.service", "usr/lib/systemd/user/osupad-daemon.service", "644"],
    ["../../packaging/linux/deb/osupad.desktop", "usr/share/applications/osupad.desktop", "644"],
    ["../../packaging/linux/udev/99-osupad.rules", "usr/lib/udev/rules.d/99-osupad.rules", "644"],
    ["../../packaging/linux/deb/install-origin", "usr/lib/osupad/install-origin", "644"],
]

[package.metadata.generate-rpm]
name = "osupad"
summary = "Low-latency ESP32-S3 keypad manager, telemetry HUD, and tray applet for osu!"
description = "osu!pad desktop daemon, configuration GUI, and CLI utility."
license = "MIT AND LGPL-3.0-only"
assets = [
    { source = "../target/release/osupad-daemon", dest = "/usr/bin/osupad-daemon", mode = "755" },
    { source = "../target/release/osupad-gui", dest = "/usr/bin/osupad-gui", mode = "755" },
    { source = "../target/release/osupadctl", dest = "/usr/bin/osupadctl", mode = "755" },
    { source = "../../packaging/linux/systemd-user/osupad-daemon.service", dest = "/usr/lib/systemd/user/osupad-daemon.service", mode = "644" },
    { source = "../../packaging/linux/rpm/osupad.desktop", dest = "/usr/share/applications/osupad.desktop", mode = "644" },
    { source = "../../packaging/linux/udev/99-osupad.rules", dest = "/usr/lib/udev/rules.d/99-osupad.rules", mode = "644" },
    { source = "../../packaging/linux/rpm/install-origin", dest = "/usr/lib/osupad/install-origin", mode = "644" },
]
post_install_script = """
if [ $1 -ge 1 ]; then
    if command -v udevadm >/dev/null 2>&1; then
        udevadm control --reload-rules || true
        udevadm trigger --subsystem-match=tty --subsystem-match=usb || true
    fi
fi
"""
post_uninstall_script = """
if [ $1 -eq 0 ]; then
    if command -v udevadm >/dev/null 2>&1; then
        udevadm control --reload-rules || true
    fi
fi
"""

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
wayland-libs = "*"
libX11 = "*"
libXcursor = "*"
libxkbcommon = "*"
libXi = "*"
dbus-libs = "*"
