[package]
publish = false
name = "opad-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "opad-gui"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["image", "canvas"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["color_picker", "number_input"] }
rfd = "0.15"
opad-layout = { path = "../crates/opad-layout" }
opad-ui-preview = { path = "../crates/opad-ui-preview" }
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
opad-model = { path = "../crates/opad-model" }
opad-ipc = { path = "../crates/opad-ipc" }
opad-tosu = { path = "../crates/opad-tosu" }
dirs.workspace = true
futures-util = { workspace = true, features = ["sink"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
evdev = "0.13"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
zbus = { version = "5.19", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = { version = "0.19", default-features = false }

[package.metadata.deb]
name = "opad"
maintainer = "GFerreiroS <info@gferreiro.com>"
copyright = "2026, GFerreiroS <info@gferreiro.com>"
license-file = ["../../packaging/linux/deb/copyright", "0"]
extended-description = "Low-latency ESP32-S3 keypad manager, telemetry HUD, and tray applet for osu!"
section = "games"
priority = "optional"
depends = "$auto, libvulkan1, libwayland-client0, libx11-6, libxcursor1, libxkbcommon0, libxi6, libdbus-1-3, libasound2t64 | libasound2"
maintainer-scripts = "../../packaging/linux/deb"
assets = [
    ["../target/release/opad-daemon", "usr/bin/opad-daemon", "755"],
    ["../target/release/opad-gui", "usr/bin/opad-gui", "755"],
    ["../target/release/opadctl", "usr/bin/opadctl", "755"],
    ["../../build/espflash/espflash", "usr/lib/opad/bin/espflash", "755"],
    ["../../packaging/linux/deb/opad-daemon.service", "usr/lib/systemd/user/opad-daemon.service", "644"],
    ["../../packaging/linux/deb/opad.desktop", "usr/share/applications/opad.desktop", "644"],
    ["../../packaging/linux/xdg-autostart/opad-gui.desktop", "etc/xdg/autostart/opad-gui.desktop", "644"],
    ["../../packaging/linux/udev/70-opad.rules", "usr/lib/udev/rules.d/70-opad.rules", "644"],
    ["../../packaging/linux/deb/install-origin", "usr/lib/opad/install-origin", "644"],
    ["../../packaging/linux/deb/install-origin", "etc/opad/install-origin", "644"],
    ["assets/fonts/Montserrat-OFL.txt", "usr/share/doc/opad/Montserrat-OFL.txt", "644"],
    ["../../build/tosu/tosu", "usr/lib/opad/tosu/tosu", "755"],
    ["../../build/tosu/VERSION", "usr/lib/opad/tosu/VERSION", "644"],
    ["../../build/tosu/NOTICE", "usr/lib/opad/tosu/NOTICE", "644"],
    ["../../build/tosu/LICENSE", "usr/lib/opad/tosu/LICENSE", "644"],
    ["../../build/tosu/THIRD_PARTY_NOTICES.txt", "usr/lib/opad/tosu/THIRD_PARTY_NOTICES.txt", "644"],
]

[package.metadata.generate-rpm]
name = "opad"
version = "1.0.0~rc"
summary = "Low-latency ESP32-S3 keypad manager, telemetry HUD, and tray applet for osu!"
description = "OPad desktop daemon, configuration GUI, and CLI utility."
license = "MIT AND LGPL-3.0-only AND OFL-1.1"
assets = [
    { source = "../target/release/opad-daemon", dest = "/usr/bin/opad-daemon", mode = "755" },
    { source = "../target/release/opad-gui", dest = "/usr/bin/opad-gui", mode = "755" },
    { source = "../target/release/opadctl", dest = "/usr/bin/opadctl", mode = "755" },
    { source = "../../build/espflash/espflash", dest = "/usr/lib/opad/bin/espflash", mode = "755" },
    { source = "../../packaging/linux/rpm/opad-daemon.service", dest = "/usr/lib/systemd/user/opad-daemon.service", mode = "644" },
    { source = "../../packaging/linux/rpm/opad.desktop", dest = "/usr/share/applications/opad.desktop", mode = "644" },
    { source = "../../packaging/linux/xdg-autostart/opad-gui.desktop", dest = "/etc/xdg/autostart/opad-gui.desktop", mode = "644" },
    { source = "../../packaging/linux/udev/70-opad.rules", dest = "/usr/lib/udev/rules.d/70-opad.rules", mode = "644" },
    { source = "../../packaging/linux/rpm/install-origin", dest = "/usr/lib/opad/install-origin", mode = "644" },
    { source = "../../packaging/linux/rpm/install-origin", dest = "/etc/opad/install-origin", mode = "644" },
    { source = "assets/fonts/Montserrat-OFL.txt", dest = "/usr/share/licenses/opad/Montserrat-OFL.txt", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/opad/LICENSE", mode = "644" },
    { source = "../../build/tosu/tosu", dest = "/usr/lib/opad/tosu/tosu", mode = "755" },
    { source = "../../build/tosu/VERSION", dest = "/usr/lib/opad/tosu/VERSION", mode = "644" },
    { source = "../../build/tosu/NOTICE", dest = "/usr/lib/opad/tosu/NOTICE", mode = "644" },
    { source = "../../build/tosu/LICENSE", dest = "/usr/lib/opad/tosu/LICENSE", mode = "644" },
    { source = "../../build/tosu/THIRD_PARTY_NOTICES.txt", dest = "/usr/lib/opad/tosu/THIRD_PARTY_NOTICES.txt", mode = "644" },
]
post_install_script = """
if [ $1 -ge 1 ]; then
    if command -v udevadm >/dev/null 2>&1; then
        udevadm control --reload-rules || true
        udevadm trigger --subsystem-match=tty --subsystem-match=usb --subsystem-match=input || true
    fi
    # tosu reads osu!'s memory; under Yama ptrace_scope 1-2 that needs this
    if [ -f /usr/lib/opad/tosu/tosu ] && command -v setcap >/dev/null 2>&1; then
        setcap cap_sys_ptrace=eip /usr/lib/opad/tosu/tosu || true
    fi
fi
"""
post_uninstall_script = """
if [ $1 -eq 0 ]; then
    if command -v udevadm >/dev/null 2>&1; then
        udevadm control --reload-rules || true
    fi
    rm -rf /usr/lib/opad /etc/opad
fi
"""

auto-req = "disabled"

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
libwayland-client = "*"
libX11 = "*"
libXcursor = "*"
libxkbcommon = "*"
libXi = "*"
dbus-libs = "*"
# The Diagnostics chatter beep (rodio) links libasound
alsa-lib = "*"
