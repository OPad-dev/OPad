[workspace]
resolver = "2"
members = [
    "crates/osupad-model",
    "crates/osupad-protocol",
    "crates/osupad-storage",
    "crates/osupad-ipc",
    "crates/osupad-tosu",
    "crates/osupad-device",
    "crates/osupad-ui-preview",
    "crates/osupad-layout",
    "daemon",
    "gui",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GFerreiroS <info@gferreiro.com>"]
license = "MIT"
repository = "https://github.com/GFerreiroS/osupad"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
prost = "0.13"
prost-build = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
serialport = "4.6"
thiserror = "1.0"
anyhow = "1.0"
interprocess = { version = "2.2", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.7"
byteorder = "1.5"
tray-icon = "0.19"
winit = "0.30"
iced = { version = "0.13", features = ["tokio", "advanced"] }
