[workspace]
resolver = "2"
members = [
    "crates/opad-model",
    "crates/opad-protocol",
    "crates/opad-storage",
    "crates/opad-ipc",
    "crates/opad-tosu",
    "crates/opad-update",
    "crates/opad-device",
    "crates/opad-ui-preview",
    "crates/opad-layout",
    "daemon",
    "gui",
    "cli",
]

[workspace.package]
version = "1.0.0-rc"
edition = "2021"
authors = ["GFerreiroS <info@gferreiro.com>"]
license = "MIT"
repository = "https://github.com/OPad-dev/OPad"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
prost = "0.13"
prost-build = "0.13"
# Pure-Rust .proto compiler: no system protoc needed to build
protox = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
serialport = "4.6"
thiserror = "1.0"
anyhow = "1.0"
interprocess = { version = "2.2", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
bytes = "1.7"
byteorder = "1.5"
iced = { version = "0.14", features = ["tokio", "advanced"] }
