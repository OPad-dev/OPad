syntax = "proto3";

package osupad;

// Protocol version definition
enum ProtocolVersion {
    PROTOCOL_VERSION_UNSPECIFIED = 0;
    PROTOCOL_VERSION_V1 = 1;
}

// System / Operational state
enum DeviceState {
    DEVICE_STATE_UNKNOWN = 0;
    DEVICE_STATE_IDLE = 1;
    DEVICE_STATE_PLAYING = 2;
    DEVICE_STATE_COOLDOWN = 3;
    DEVICE_STATE_SYNC = 4;
}

// Severity level for diagnostic events
enum LogLevel {
    LOG_LEVEL_DEBUG = 0;
    LOG_LEVEL_INFO = 1;
    LOG_LEVEL_WARN = 2;
    LOG_LEVEL_ERROR = 3;
}

// -----------------------------------------------------------------------------
// Core Handshake & Status Messages
// -----------------------------------------------------------------------------

message Hello {
    uint32 protocol_version = 1;
    string client_version = 2;
}

message HelloAck {
    uint32 protocol_version = 1;
    string firmware_version = 2;
    string board_profile = 3;
    string device_id = 4;
    uint32 counter_generation = 5;
    uint64 lifetime_key1 = 6;
    uint64 lifetime_key2 = 7;
    // Which host install owns this pad (§W3-1, §W3-2). 16 bytes; empty or all
    // zero means unclaimed, which is also what firmware predating W3-2 sends.
    bytes owner_id = 8;
    // Which app partition the running image booted from (§U-3a): "ota_0",
    // "ota_1", or "factory" for a pad still on the pre-OTA single-app layout.
    // Empty means firmware predating the two-slot table.
    string running_partition = 9;
    ConfigPayload current_config = 10;
    // The pad sends KeyPressBatch while a map is played (issue #2). False from
    // firmware predating it: the host then measures the tap rate from tosu.
    bool key_press_times = 11;
}

// Record a new owner in NVS (§W3-2). An NVS write, so the firmware must honour
// it only in IDLE, never during PLAYING or COOLDOWN (P1-3). The host only ever
// sends it at connect time, which is already an IDLE-only moment.
message ClaimOwnership {
    bytes owner_id = 1;  // 16 bytes
}

message DeviceStatus {
    uint32 uptime_seconds = 1;
    DeviceState state = 2;
    uint32 brightness = 3;
    bool display_asleep = 4;
    uint64 lifetime_key1 = 5;
    uint64 lifetime_key2 = 6;
    uint32 map_key1 = 7;
    uint32 map_key2 = 8;
    // Key edge (GPIO ISR) to HID report submit, since boot or last reset
    uint32 latency_samples = 9;
    uint32 latency_p50_us = 10;
    uint32 latency_p99_us = 11;
    uint32 latency_p999_us = 12;
    uint32 latency_max_us = 13;
    uint32 hid_deferred_reports = 14; // Key changes that waited for the next USB poll, then resent
    bool display_ok = 15;
    bool nvs_ok = 16;
    uint32 nvs_writes = 17;
}

// -----------------------------------------------------------------------------
// Configuration
// -----------------------------------------------------------------------------

message ConfigPayload {
    uint32 key1_hid_usage = 1;       // Default: 0x1D ('Z')
    uint32 key2_hid_usage = 2;       // Default: 0x1B ('X')
    uint32 debounce_us = 3;          // Lockout window, default: 5000 (5ms)
    uint32 brightness = 4;           // 0 to 100%, default: 100
    uint32 display_sleep_seconds = 5;// Inactivity timeout, default: 600 (10 min)
    uint32 gameplay_display_hz = 6;  // Gameplay refresh rate cap, default: 10
    uint32 press_color_rgb = 7 [deprecated = true]; // Deprecated: key highlight colors now come from layouts
    uint32 key1_gpio = 8;            // Switch GPIO for key 1, default: 14. 0 = keep current
    uint32 key2_gpio = 9;            // Switch GPIO for key 2, default: 9. 0 = keep current
    // What a left/right swipe on the touchscreen does (SwipeAction). Firmware
    // predating swipes ignores these and reports 0, which a host reads as the
    // defaults (previous / next track).
    SwipeAction swipe_left_action = 10;  // Default: SWIPE_ACTION_PREV_TRACK. 0 = keep current
    SwipeAction swipe_right_action = 11; // Default: SWIPE_ACTION_NEXT_TRACK. 0 = keep current
    uint32 swipe_left_key = 12;      // HID usage for SWIPE_ACTION_KEY. 0 = keep current
    uint32 swipe_right_key = 13;     // HID usage for SWIPE_ACTION_KEY. 0 = keep current
}

// Up/down swipes always set the volume; left/right do one of these. Keyboard
// keys (SWIPE_ACTION_KEY) are never sent while a map is played: the keyboard
// report then carries only K1, K2 and Quick Retry.
enum SwipeAction {
    SWIPE_ACTION_KEEP = 0;           // Wire only: leave the current action
    SWIPE_ACTION_NONE = 1;
    SWIPE_ACTION_PREV_TRACK = 2;
    SWIPE_ACTION_NEXT_TRACK = 3;
    SWIPE_ACTION_PLAY_PAUSE = 4;
    SWIPE_ACTION_MUTE = 5;
    SWIPE_ACTION_KEY = 6;            // The swipe_*_key keyboard key
}

message SetConfig {
    ConfigPayload config = 1;
}

message ConfigAck {
    bool success = 1;
    string message = 2;
    ConfigPayload current_config = 3;
}

// -----------------------------------------------------------------------------
// Time Synchronization
// -----------------------------------------------------------------------------

message TimeSync {
    uint32 year = 1;
    uint32 month = 2;    // 1 - 12
    uint32 day = 3;      // 1 - 31
    uint32 hour = 4;     // 0 - 23
    uint32 minute = 5;   // 0 - 59
    uint32 second = 6;   // 0 - 59
}

// -----------------------------------------------------------------------------
// Gameplay Telemetry Stream
// -----------------------------------------------------------------------------

message GameplayDisplayState {
    string title = 1;
    string artist = 2;
    float current_pp = 3;
    float progress_ratio = 4;         // 0.0 to 1.0
    uint32 current_map_presses_k1 = 5;
    uint32 current_map_presses_k2 = 6;
    uint32 play_id = 7;               // Changes on every new attempt (new map, retry); device zeroes map counters
    string difficulty = 8;            // Difficulty name, e.g. "Lunatic"
    float stars = 9;                  // Star rating including mods
}

// Host-side integration status, sent periodically and on every change
message HostStatus {
    bool tosu_connected = 1;          // Daemon has a live tosu WebSocket
    bool playing = 2;                 // osu! is currently playing a map
    uint32 play_id = 3;               // Changes on every new attempt (new map, retry); device zeroes map counters
    // Volume swipes go to osu! (Alt+wheel, or the plain wheel during a map)
    // rather than the system volume. Windows: osu! is the foreground window.
    // Linux: osu!lazer is running. Hosts predating swipes leave it false.
    bool osu_active = 4;
}

// One UI data source value. Source ids: firmware/main/ui/core/ui_ids.h (ui_source_t)
message DataValue {
    uint32 source = 1;
    oneof value {
        double number = 2;
        string text = 3;
        bool clear = 4;               // Source has no value
    }
}

// Changed data source values only; the host resends everything after a reconnect
message DataUpdate {
    repeated DataValue values = 1;
}

// -----------------------------------------------------------------------------
// Screen layouts (PC designer). Field meanings: firmware/main/ui/core/ui_core.h (ui_widget_t)
// -----------------------------------------------------------------------------

message UiWidget {
    uint32 kind = 1;         // ui_widget_kind_t
    uint32 source = 2;       // ui_source_t
    uint32 font = 3;         // ui_font_id_t
    uint32 align = 4;        // ui_align_t
    sint32 x = 5;
    sint32 y = 6;
    uint32 w = 7;
    uint32 h = 8;
    uint32 fg = 9;           // 0xRRGGBB
    uint32 bg = 10;
    uint32 accent = 11;
    uint32 radius = 12;
    uint32 decimals = 13;    // 255 = source default
    uint32 flags = 14;       // UI_FLAG_*
    string label = 15;
    string suffix = 16;
}

message SetLayout {
    uint32 screen = 1;       // ui_screen_id_t
    uint32 background = 2;   // 0xRRGGBB
    repeated UiWidget widgets = 3;
}

message LayoutAck {
    uint32 screen = 1;
    bool success = 2;
    string message = 3;
}

// -----------------------------------------------------------------------------
// Counter Synchronization & Recovery
// -----------------------------------------------------------------------------

message CounterState {
    string device_id = 1;
    uint32 counter_generation = 2;
    uint64 lifetime_key1 = 3;
    uint64 lifetime_key2 = 4;
}

message CounterSyncRequest {
    CounterState target_state = 1;
    bool force_restore = 2;          // Explicit restore from PC/Backup
}

message CounterSyncResponse {
    bool success = 1;
    CounterState synchronized_state = 2;
    string message = 3;
}

// -----------------------------------------------------------------------------
// Diagnostic Events
// -----------------------------------------------------------------------------

message LogEvent {
    uint32 timestamp_ms = 1;
    LogLevel level = 2;
    string tag = 3;
    string message = 4;
    uint32 event_id = 5;
    uint32 arg0 = 6;
    uint32 arg1 = 7;
}

message LogEventBatch {
    repeated LogEvent events = 1;
}

// -----------------------------------------------------------------------------
// Key press times (tap rate, issue #2)
// -----------------------------------------------------------------------------

// One accepted key-down, timed where the pad accepts it: the switch edge for
// MX, the actuation point for any other input module
message KeyPress {
    uint32 key = 1;      // 1 = K1, 2 = K2
    uint64 t_us = 2;     // pad clock (esp_timer, us since boot)
}

// Key-downs since the last batch, oldest first. Sent only while the host says
// a map is being played (HostStatus.playing), from the protocol task, never
// from the input path.
message KeyPressBatch {
    uint64 now_us = 1;              // pad clock when the batch was built
    repeated KeyPress presses = 2;
    uint32 dropped = 3;             // presses lost to a full buffer since the last batch
}

// -----------------------------------------------------------------------------
// Interactive Hardware Pin Detection
// -----------------------------------------------------------------------------

message DetectPinRequest {
    uint32 key_id = 1;       // 1 = Key 1, 2 = Key 2
    uint32 timeout_ms = 2;   // Listening timeout in ms
    uint32 exclude_gpio = 3; // GPIO to ignore (e.g. key1 when detecting key2)
}

message DetectPinResponse {
    uint32 key_id = 1;
    uint32 gpio = 2;         // Detected GPIO pin number (0 = none/timeout)
    bool success = 3;
}

// -----------------------------------------------------------------------------
// Top-Level Envelopes
// -----------------------------------------------------------------------------

message HostToDevice {
    uint32 sequence_number = 1;
    oneof payload {
        Hello hello = 2;
        SetConfig set_config = 3;
        TimeSync time_sync = 4;
        GameplayDisplayState gameplay_state = 5;
        CounterSyncRequest counter_sync = 6;
        bool request_status = 7;
        HostStatus host_status = 8;
        bool reset_latency_stats = 9;
        DataUpdate data_update = 10;
        SetLayout set_layout = 11;
        uint32 reset_layout = 12;    // screen id: back to the built-in default
        bool request_logs = 13;
        ClaimOwnership claim_ownership = 14;
        DetectPinRequest detect_pin = 15;
    }
}

message DeviceToHost {
    uint32 sequence_number = 1;
    oneof payload {
        HelloAck hello_ack = 2;
        DeviceStatus status = 3;
        ConfigAck config_ack = 4;
        CounterSyncResponse counter_sync_resp = 5;
        LogEventBatch log_batch = 6;
        LayoutAck layout_ack = 7;
        DetectPinResponse detect_pin_resp = 8;
        KeyPressBatch key_presses = 9;
    }
}
