name: Release app

# Builds and publishes one app release (tag vX.Y.Z): the Windows installer,
# the Linux packages (glibc <= 2.31), the AppImage and the tarball, with
# third-party notices and the bundled tosu's source. Started by
# release-please.yml when an app release PR is merged, or by hand with a tag.
# See docs/specs/release-and-updates.md §4.
#
# Signing steps run only when the repository variable SIGNING_ENABLED is
# "true" (§19); until then every release is a pre-release.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "App tag to build, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ESPFLASH_VERSION: "4.6.0"
  ESPFLASH_WINDOWS_SHA256: "b2cb4656b067716fe2b3794cf0604b461b2476d06dee7f481704cb6c8495b11c"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  # The Designer must draw with the firmware's real LVGL, never the stub
  OPAD_REQUIRE_UI_PREVIEW: "1"

jobs:
  check:
    name: Tag matches the tree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Check versions
        run: |
          out="$(python3 scripts/release/check_versions.py --tag "${{ inputs.tag }}")"
          echo "$out"
          grep -qx 'component=app' <<<"$out" || { echo "${{ inputs.tag }} is not an app tag" >&2; exit 1; }

      - name: Version and channel
        id: v
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A SemVer pre-release is a pre-release; so is everything until
          # releases are signed (§5.4)
          if [[ "$version" == *-* || "$SIGNING_ENABLED" != "true" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Linux packages (glibc <= 2.31)
    needs: check
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libudev-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev \
            binutils rpm cpio file unzip

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-zigbuild,cargo-about

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install appimagetool (pinned)
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
          # No FUSE on the runner
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # Rebuilds tosu's lazer pp calculator in almalinux:8 (docker) and its
      # tsprocess addon with zig, so tosu runs down to glibc 2.28 (RHEL 9,
      # Ubuntu 22.04, Debian 12); upstream's prebuilt needs glibc 2.38
      - name: Build bundled tosu
        run: make tosu

      - name: Fetch LVGL for the Designer preview
        run: |
          make lvgl
          echo "OPAD_LVGL_DIR=$PWD/build/lvgl" >> "$GITHUB_ENV"

      - name: Build release binaries against glibc 2.31
        run: |
          cargo zigbuild --release --locked --bins \
            --manifest-path desktop/Cargo.toml --target x86_64-unknown-linux-gnu.2.31
          mkdir -p desktop/target/release
          cp desktop/target/x86_64-unknown-linux-gnu/release/{opad-daemon,opad-gui,opadctl} desktop/target/release/

      # Upstream's Linux espflash needs glibc 2.34; build the same version here
      - name: Build espflash against glibc 2.31
        run: |
          git clone --depth 1 --branch "v${ESPFLASH_VERSION}" https://github.com/esp-rs/espflash.git build/espflash-src
          (cd build/espflash-src && cargo zigbuild --release --locked -p espflash \
            --target x86_64-unknown-linux-gnu.2.31)
          mkdir -p build/espflash
          install -m 755 build/espflash-src/target/x86_64-unknown-linux-gnu/release/espflash build/espflash/espflash

      - name: Assert glibc <= 2.31
        run: |
          for bin in desktop/target/release/opad-daemon desktop/target/release/opad-gui \
                     desktop/target/release/opadctl build/espflash/espflash; do
            max_ver=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
            echo "$bin: $max_ver"
            if dpkg --compare-versions "${max_ver#GLIBC_}" gt "2.31"; then
              echo "ERROR: $bin needs $max_ver, above glibc 2.31" >&2
              exit 1
            fi
          done
          # tosu targets glibc 2.28 (see "Build bundled tosu"). Its native
          # addons are what the rebuild makes portable, and they are packed
          # inside the binary, so check them here where they are still files.
          for bin in build/tosu/tosu build/tosu-src/packages/tosu/dist/*.node; do
            [ -f "$bin" ] || { echo "ERROR: $bin is missing" >&2; exit 1; }
            max_ver=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
            echo "$bin: $max_ver"
            if dpkg --compare-versions "${max_ver#GLIBC_}" gt "2.28"; then
              echo "ERROR: $bin needs $max_ver, above glibc 2.28" >&2
              exit 1
            fi
          done

      - name: Build packages
        env:
          OPAD_PREBUILT: "1"
        run: ./scripts/release/build_packages.sh

      # Again on what was actually packaged: a packaging step that rebuilt the
      # binaries would otherwise slip host-glibc ones past the check above
      - name: Assert glibc <= 2.31 inside the packages
        run: |
          rm -rf pkgcheck && mkdir -p pkgcheck/deb pkgcheck/rpm
          dpkg-deb -x dist/*.deb pkgcheck/deb
          (cd pkgcheck/rpm && rpm2cpio ../../dist/*.rpm | cpio -idm --quiet)
          (cd pkgcheck && ../dist/*.AppImage --appimage-extract >/dev/null)
          for bin in pkgcheck/{deb,rpm}/usr/bin/* pkgcheck/{deb,rpm}/usr/lib/opad/bin/espflash \
                     pkgcheck/squashfs-root/usr/bin/* pkgcheck/squashfs-root/usr/lib/opad/bin/espflash; do
            max_ver=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
            echo "$bin: $max_ver"
            if dpkg --compare-versions "${max_ver#GLIBC_}" gt "2.31"; then
              echo "ERROR: $bin needs $max_ver, above glibc 2.31" >&2
              exit 1
            fi
          done
          for bin in pkgcheck/{deb,rpm,squashfs-root}/usr/lib/opad/tosu/tosu; do
            [ -f "$bin" ] || { echo "ERROR: $bin is missing" >&2; exit 1; }
            max_ver=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
            echo "$bin: $max_ver"
            if dpkg --compare-versions "${max_ver#GLIBC_}" gt "2.28"; then
              echo "ERROR: $bin needs $max_ver, above glibc 2.28" >&2
              exit 1
            fi
          done

      # Install each package on clean distros and exercise it (install scripts,
      # libraries, daemon, espflash, tosu, removal)
      - name: Test the packages on clean distros
        run: scripts/release/test_packages.sh ubuntu:22.04 ubuntu:24.04 debian:12 debian:13 rockylinux:9 fedora:43

      - name: Third-party notices and tosu source
        run: |
          make notices
          make tosu-source
          make lazer-calculator-source

      # One file name per format, with the SemVer version in it. The package
      # managers read the version from inside the package; GitHub would mangle
      # the "~" cargo-deb and RPM put in theirs.
      - name: Stage Linux artifacts
        run: |
          mkdir -p staging/tar/bin out
          cp desktop/target/release/{opad-daemon,opad-gui,opadctl} staging/tar/bin/
          cp README.md LICENSE dist/THIRD_PARTY_NOTICES.html staging/tar/
          tar -czf "out/opad-linux-x86_64-${VERSION}.tar.gz" -C staging/tar .
          mv dist/*.deb "out/opad_${VERSION}_amd64.deb"
          mv dist/*.rpm "out/opad-${VERSION}.x86_64.rpm"
          mv dist/*.AppImage "out/opad-${VERSION}-x86_64.AppImage"
          mv dist/THIRD_PARTY_NOTICES.html dist/*-source.tar.gz out/
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  build-windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build bundled tosu (tosu.exe)
        shell: bash
        run: |
          tosu_version="$(sed -n 's/^TOSU_VERSION ?= //p' Makefile)"
          git clone --depth 1 --branch "${tosu_version}" https://github.com/KotRikD/tosu.git build/tosu-src
          (cd build/tosu-src && pnpm install --frozen-lockfile && pnpm --filter tosu run compile:win)
          mkdir -p build/tosu
          cp build/tosu-src/packages/tosu/dist/tosu.exe build/tosu/

      - name: Fetch LVGL for the Designer preview
        shell: bash
        run: |
          ver=$(sed -n '/^  lvgl\/lvgl:/,/^    version:/s/^    version: //p' firmware/dependencies.lock)
          git clone --depth 1 --branch "v${ver}" https://github.com/lvgl/lvgl.git build/lvgl
          echo "OPAD_LVGL_DIR=$(cygpath -w "$PWD/build/lvgl")" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --locked --bins --manifest-path desktop/Cargo.toml

      - name: Fetch espflash (pinned, checksummed)
        shell: bash
        run: |
          curl -fsSL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/v${ESPFLASH_VERSION}/espflash-x86_64-pc-windows-msvc.zip"
          echo "${ESPFLASH_WINDOWS_SHA256}  espflash.zip" | sha256sum -c -
          unzip -o espflash.zip espflash.exe -d desktop/target/release

      # §19.4. SignPath signs the programs before they go into the installer,
      # then the installer itself (below). Skipped until signing is enabled.
      - name: Collect the programs to sign
        if: vars.SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          mkdir -p to-sign
          cp desktop/target/release/{opad-daemon,opad-gui,opadctl}.exe to-sign/

      - name: Upload the programs for signing
        id: unsigned-bins
        if: vars.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-programs
          path: to-sign/*.exe

      - name: Sign the programs (SignPath)
        if: vars.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: opad
          signing-policy-slug: release-signing
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-bins.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-programs

      - name: Use the signed programs
        if: vars.SIGNING_ENABLED == 'true'
        shell: bash
        run: cp signed-programs/*.exe desktop/target/release/

      - name: Build installer
        shell: bash
        run: |
          mkdir -p out
          iscc packaging/windows/installer.iss
          cp build/installer/opad-setup.exe "out/opad-setup-${VERSION}.exe"

      - name: Upload the installer for signing
        id: unsigned-installer
        if: vars.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: out/opad-setup-*.exe

      - name: Sign the installer (SignPath)
        if: vars.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: opad
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/opad-setup-*.exe

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [check, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "{linux,windows}"
          path: staging
          merge-multiple: true

      - name: Checksums
        run: |
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        run: scripts/release/publish_release.sh "$TAG" staging "$PRERELEASE" latest-if-final


  feed:
    name: Update feed
    needs: publish
    uses: ./.github/workflows/update-feed.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
