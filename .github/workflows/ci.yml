name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Format, Clippy, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Check code formatting
        working-directory: desktop
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit & Integration Tests
        working-directory: desktop
        run: cargo test --workspace

  rust-windows:
    # §W4-1. cargo check alone is not enough: the ksni/tray-icon split and the
    # IPC transport aliases fail at link time, not at check time, so this job
    # builds and runs the tests on a real windows-msvc host.
    name: Rust on Windows (Format, Clippy, Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: windows

      - name: Check code formatting
        working-directory: desktop
        run: cargo fmt --check

      # osupad-gui is excluded here and built by the job below, so that one
      # crate's Windows port does not hide regressions in the other eleven.
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --exclude osupad-gui --all-targets -- -D warnings

      - name: Build
        working-directory: desktop
        run: cargo build --workspace --exclude osupad-gui

      - name: Workspace Unit & Integration Tests
        working-directory: desktop
        run: cargo test --workspace --exclude osupad-gui

  rust-windows-gui:
    # EXPECTED TO FAIL until W0-5 lands. osupad-gui depends on ksni
    # unconditionally, and ksni is a Linux D-Bus StatusNotifierItem crate; the
    # cross-platform tray splits it behind cfg(target_os) and adds tray-icon
    # for Windows. The job exists now so that work has a target to turn green,
    # and it is separate so it fails on its own rather than reddening the rest.
    name: Windows GUI (red until W0-5)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: windows-gui

      - name: Clippy
        working-directory: desktop
        run: cargo clippy -p osupad-gui --all-targets -- -D warnings

      - name: Build
        working-directory: desktop
        run: cargo build -p osupad-gui

  firmware-host-tests:
    name: Firmware Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run firmware host unit tests
        run: ./firmware/test/host/run_tests.sh

  proto-check:
    name: Protobuf Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nanopb generator
        run: |
          python -m pip install --upgrade pip
          pip install protobuf grpcio-tools nanopb

      - name: Regenerate protobuf
        run: ./scripts/gen_proto.sh

      - name: Verify no diff
        run: git diff --exit-code firmware/main/protocol/

  firmware-build:
    name: ESP32-S3 Firmware Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware with ESP-IDF
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32s3 build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
