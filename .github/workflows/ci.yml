name: CI

# Not on every push (owner, 2026-11-23): main reaches GitHub only after
# the same jobs passed on the lab's mini PC (scripts/ci/lab-ci.sh, `make
# push`). It runs before a release is built (release-please.yml calls it
# once a release PR is merged, and the build waits for it), on pull
# requests, and by hand (Run workflow, or `gh workflow run ci.yml --ref
# <branch>`).
#
# Each job installs its tools here, then runs scripts/ci/jobs.sh or
# jobs.ps1: the lab runs those same scripts, so the checks are written once.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["**"]

concurrency:
  # Called from Release Please, github.workflow is the caller's name
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A release's checks are never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Release versions agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # SemVer in desktop/Cargo.toml and firmware/CMakeLists.txt, the same in
      # .release-please-manifest.json and Cargo.lock, and every workspace
      # crate listed for release-please's Cargo.lock bump
      - name: Check versions
        run: scripts/ci/jobs.sh versions

  rust:
    name: Rust (Format, Clippy, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libdbus-1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: desktop

      - name: Format, Clippy, Unit & Integration Tests
        run: scripts/ci/jobs.sh rust

  rust-windows:
    # §W4-1. cargo check alone is not enough: the ksni/tray-icon split and the
    # IPC transport aliases fail at link time, not at check time, so this job
    # builds and runs the tests on a real windows-msvc host.
    name: Rust on Windows (Format, Clippy, Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: desktop
          key: windows

      # opad-gui is excluded here and built by the job below, so that one
      # crate's Windows port does not hide regressions in the other eleven.
      - name: Format, Clippy, Build, Unit & Integration Tests
        run: ./scripts/ci/jobs.ps1 rust-windows

  rust-windows-gui:
    name: Windows GUI (Clippy, Build, Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: desktop
          key: windows-gui

      - name: Clippy, Build, GUI Unit Tests
        run: ./scripts/ci/jobs.ps1 rust-windows-gui

  firmware-host-tests:
    name: Firmware Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install compiler
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential

      - name: Run firmware host unit tests
        run: scripts/ci/jobs.sh firmware-host-tests

  proto-check:
    name: Protobuf Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install nanopb generator
        run: |
          python -m pip install --upgrade pip
          # The committed opad.pb.[ch] name the generator version, so a newer
          # nanopb fails the diff on that line alone
          pip install protobuf grpcio-tools nanopb==0.4.9.1

      - name: Regenerate protobuf and verify no diff
        run: scripts/ci/jobs.sh proto-check

  firmware-build:
    name: ESP32-S3 Firmware Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The components the IDF component manager downloads, and ccache's
      # object cache: most of a clean build is recompiling ESP-IDF itself
      - name: Cache components and compiler output
        uses: actions/cache@v6
        with:
          path: |
            firmware/managed_components
            .ccache
          key: firmware-${{ hashFiles('firmware/dependencies.lock', 'firmware/sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: |
            firmware-${{ hashFiles('firmware/dependencies.lock', 'firmware/sdkconfig.defaults') }}-

      - name: Build firmware with ESP-IDF
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: scripts/ci/jobs.sh firmware-build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3-firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin

  license-compliance:
    name: Licences (REUSE, cargo-deny, third-party notices)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install reuse
        run: pipx install reuse

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      # REUSE, cargo-deny (advisories, licences, bans, sources), and the
      # third-party notices generate
      - name: Licence checks
        run: scripts/ci/jobs.sh licences
