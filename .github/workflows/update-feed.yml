name: Update feed

# Builds the update feeds (stable.json, beta.json) from the published
# releases, signs them, and deploys them to GitHub Pages, where every OPad
# install reads them (docs/specs/release-and-updates.md §5).
#
# Runs after every release, by hand (after editing updates/policy.json to
# pull a release or change a rollout), and weekly: a feed expires 30 days
# after it was built, so it must be republished before then.
#
# An app release (release-app.yml) calls it with deploy: false first: the
# lab VMs update the previous release from this signed feed, served inside
# each VM, and release-app.yml deploys the same feed only once they passed.
#
# Each feed gets two signatures. <channel>.json.release.minisig is the one
# builds from 1.0.0-rc.6 on read: signed with the feed key in the "release"
# environment, which waits for approval (§19.2), once FEED_KEY_ENABLED (or
# SIGNING_ENABLED) is "true". <channel>.json.minisig is signed with the
# committed test key, which protects nothing, for builds up to 1.0.0-rc.5,
# which trust nothing else (§5.4). Until the feed key is enabled both are
# signed with the test key, which new builds only trust on lab machines.

on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the signed feeds (false: leave them as this run's github-pages artifact)"
        type: boolean
        required: false
        default: true
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    name: Build the feeds
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: desktop
          key: opad-feed

      - name: Build opad-feed
        run: cargo build --release --locked -p opad-update --bin opad-feed --manifest-path desktop/Cargo.toml

      - name: Published releases
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" > releases.json
          # SHA256SUMS of each release, in case the API gives no digest
          mkdir -p sums
          for tag in $(jq -r '.[] | select(.draft == false) | .tag_name' releases.json); do
            gh release download "$tag" -p SHA256SUMS -O "sums/${tag}.SHA256SUMS" 2>/dev/null || true
          done

      - name: Build stable.json and beta.json
        run: |
          desktop/target/release/opad-feed github \
            --releases releases.json --sums-dir sums --policy updates/policy.json \
            --out-dir site

      - name: Keep opad-feed for signing
        run: cp desktop/target/release/opad-feed site/.opad-feed

      - uses: actions/upload-artifact@v7
        with:
          name: feed-unsigned
          path: site
          include-hidden-files: true

  # Until §19: the committed test key. No secret, no approval.
  sign-test:
    name: Sign (test key)
    needs: build
    if: vars.SIGNING_ENABLED != 'true' && vars.FEED_KEY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: feed-unsigned
          path: site

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign and verify
        run: |
          chmod +x site/.opad-feed
          for channel in stable beta; do
            minisign -S -s desktop/crates/opad-update/test-key/opad-test.key \
              -m "site/${channel}.json" -t "OPad ${channel} feed (TEST KEY)" < /dev/null
            cp "site/${channel}.json.minisig" "site/${channel}.json.release.minisig"
            OPAD_TRUST_TEST_KEY=1 site/.opad-feed verify --feed "site/${channel}.json" --channel "$channel"
          done
          rm site/.opad-feed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # §19: the real feed key, only after a person approves this job
  sign-release:
    name: Sign (release key)
    needs: build
    if: vars.SIGNING_ENABLED == 'true' || vars.FEED_KEY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo

      - uses: actions/download-artifact@v8
        with:
          name: feed-unsigned
          path: site

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign and verify
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod +x site/.opad-feed
          for channel in stable beta; do
            # minisign reads the passphrase from stdin when it is not a terminal
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" \
              -m "site/${channel}.json" -x "site/${channel}.json.release.minisig" \
              -t "OPad ${channel} feed"
            site/.opad-feed verify --feed "site/${channel}.json" --channel "$channel"
            # For builds up to 1.0.0-rc.5, which trust only the test key
            minisign -S -s repo/desktop/crates/opad-update/test-key/opad-test.key \
              -m "site/${channel}.json" -t "OPad ${channel} feed (TEST KEY)" < /dev/null
            OPAD_TRUST_TEST_KEY=1 site/.opad-feed verify --feed "site/${channel}.json" \
              --channel "$channel" --signature "site/${channel}.json.minisig"
          done
          rm site/.opad-feed

      # §10.1: apt and dnf repositories, only with the real key (§19.3)
      - name: Packages of the last three app releases per channel
        if: vars.SIGNING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" | jq -s 'add' > releases.json
          for channel in stable beta; do
            filter='true'
            [ "$channel" = stable ] && filter='.prerelease == false'
            mkdir -p "pkgs/$channel"
            for tag in $(jq -r "[.[] | select(.draft == false and (.tag_name | test(\"^v[0-9]\"))) | select($filter)]
                                | sort_by(.published_at) | reverse | .[:3][] | .tag_name" releases.json); do
              gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm' -D "pkgs/$channel"
            done
          done

      - name: Install repository tools
        if: vars.SIGNING_ENABLED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c gnupg

      - name: Build the apt and dnf repositories
        if: vars.SIGNING_ENABLED == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          export GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          repo/scripts/release/build_repos.sh site stable=pkgs/stable beta=pkgs/beta

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [sign-test, sign-release]
    # inputs.deploy is unset for the schedule and by hand, and an unset input
    # compares equal to false (both are 0 to GitHub's ==), so it is compared
    # as text: '' deploys, only 'false' does not
    if: always() && format('{0}', inputs.deploy) != 'false' && (needs.sign-test.result == 'success' || needs.sign-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
