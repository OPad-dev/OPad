name: Lab install

# Tests an app release's installers in the self-hosted lab's VMs (the
# Windows 11 mini PC, runner label opad-lab): in each VM, from a clean
# snapshot, install the previous release, upgrade to this one, check OPad
# starts at login, opens and keeps its data, then uninstall and check nothing
# is left. See scripts/lab/lab-install.ps1. Called with feed: true (release-
# app.yml), the upgrade is the app's own updater taking this release from the
# signed feed that release built (its github-pages artifact), served inside
# each VM; the feed is deployed only if this passes. Called by release-app.yml for
# every app release, or started by hand; never from a pull request (a
# self-hosted runner must not run code from one).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      feed:
        description: "Upgrade through the app's updater from this run's github-pages artifact"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "App release tag, e.g. v1.0.0-rc.3 (empty: the newest)"
        required: false
        default: ""
        type: string
      from:
        description: "Release to upgrade from (empty: the one before; none: skip)"
        required: false
        default: ""
        type: string
      vms:
        description: "VMs, comma-separated (empty: all)"
        required: false
        default: ""
        type: string
      deployed_feed:
        description: "Upgrade through the app's updater from the deployed beta feed (it must offer the tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # The release-extras-<tag> artifacts (FILES.sha256, the PKGBUILD) of the
  # runs that built the releases under test
  actions: read

jobs:
  install:
    name: Installers in the lab VMs
    runs-on: [self-hosted, opad-lab]
    # One lab job at a time on the mini PC (job level: also when called)
    concurrency:
      group: opad-lab
      cancel-in-progress: false
    # Seven VMs, each with two installs and three reboots
    timeout-minutes: 240
    steps:
      # The lab scripts from main, the packages from the release
      - uses: actions/checkout@v7
        with:
          ref: main

      # The signed feeds update-feed.yml built for this release, not deployed
      - uses: actions/download-artifact@v8
        if: ${{ inputs.feed }}
        with:
          name: github-pages
          path: lab-feed-artifact

      - name: Download the deployed feed
        if: ${{ inputs.deployed_feed }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force lab-feed | Out-Null
          foreach ($f in "beta.json", "beta.json.minisig", "beta.json.release.minisig") {
              Invoke-WebRequest -UseBasicParsing -OutFile "lab-feed\$f" "https://updates.opad.dev/$f"
          }

      - name: Unpack the feed
        if: ${{ inputs.feed }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force lab-feed | Out-Null
          tar -xf lab-feed-artifact\artifact.tar -C lab-feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem lab-feed

      - name: Install, update, start and uninstall in each VM
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
          FROM: ${{ inputs.from }}
          VMS: ${{ inputs.vms }}
          FEED: ${{ (inputs.feed || inputs.deployed_feed) && 'lab-feed' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $vms = @($env:VMS -split "," | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          & scripts\lab\lab-install.ps1 -Tag $env:TAG -From $env:FROM -Vms $vms -Feed $env:FEED -OutDir lab-install
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-install
          path: |
            lab-install/*.png
            lab-install/*.log
          retention-days: 14
