# Intended netlist of the HE input module V3, written from docs/specs/hardware-redesign-brief.md 4.2,
# the Waveshare header table in AGENTS.md 6 and the datasheets in opadverify/devices.py.
# Keys on y = 83.5 at 19.05 mm; sensors under the key centres.

[board]
title = "HE input module V3"
pcb = "../../pcb/V3/HE/he_input_v3.kicad_pcb"
gerbers = "../../pcb/V3/HE/production/jlcpcb/he_input_v3-gerbers.zip"
cpl = "../../pcb/V3/HE/production/jlcpcb/he_input_v3-CPL-JLCPCB.csv"
cpl_from = "jlc"     # export_v3.py fits JLCPCB's own footprints
bom = "../../pcb/V3/HE/production/jlcpcb/he_input_v3-BOM-JLCPCB.csv"

[part.J1]   # SPI module
device = "FFC14"
lcsc = "C262720"
mpn = "AFA07-S14FCA-00"
pins = { "1" = "GND", "2" = "5V", "3" = "3V3", "4" = "ID", "5" = "MISO", "6" = "GND", "7" = "SCLK", "8" = "MOSI", "9" = "GND", "10" = "CS", "11" = "NC", "12" = "3V3", "13" = "5V", "14" = "GND" }

[part.U1]   # key 1 sensor
device = "DRV5055"
lcsc = "C266128"
mpn = "DRV5055A3QDBZR"
pins = { VCC = "AVDD", OUT = "OUT_K1", GND = "GND" }

[part.U2]   # key 2 sensor
device = "DRV5055"
lcsc = "C266128"
mpn = "DRV5055A3QDBZR"
pins = { VCC = "AVDD", OUT = "OUT_K2", GND = "GND" }

[part.U3]   # key 3 sensor
device = "DRV5055"
lcsc = "C266128"
mpn = "DRV5055A3QDBZR"
pins = { VCC = "AVDD", OUT = "OUT_K3", GND = "GND" }

[part.U4]   # ADC (ADS7028, same pinout and registers as the ADS7038); AVDD is its reference
device = "ADS7038"
lcsc = "C880341"
mpn = "ADS7028IRTER"
pins = { AVDD = "AVDD", DVDD = "3V3", DECAP = "DECAP", GND = "GND", EP = "GND", CS = "CS", SCLK = "SCLK", SDI = "MOSI", SDO = "SDO", AIN5 = "AIN_K1", AIN4 = "AIN_K2", AIN3 = "AIN_K3", AIN0 = "NC", AIN1 = "NC", AIN2 = "NC", AIN6 = "NC", AIN7 = "NC" }

[part.U5]   # LDO 3.3 V for sensors + AVDD
device = "LP5907"
lcsc = "C80670"
mpn = "LP5907MFX-3.3"
pins = { IN = "5V_F", EN = "5V_F", GND = "GND", NC = "NC", OUT = "AVDD" }

[part.U6]   # ESD
device = "SRV05_4"
lcsc = "C85364"
mpn = "SRV05-4-P-T7"
pins = { IO1 = "SCLK", IO2 = "MOSI", IO3 = "MISO", IO4 = "CS", GND = "GND", REF = "3V3" }

[part.FB1]   # ferrite before the LDO
device = "R0603"
lcsc = "C1002"
mpn = "GZ1608D601TF"
nets = ["5V", "5V_F"]

[part.C1]   # LDO input 1uF
device = "R0603"
lcsc = "C15849"
mpn = "CL10A105KB8NNNC"
nets = ["5V_F", "GND"]

[part.C2]   # LDO output 1uF
device = "R0603"
lcsc = "C15849"
mpn = "CL10A105KB8NNNC"
nets = ["AVDD", "GND"]

[part.C3]   # ADC AVDD 1uF
device = "R0603"
lcsc = "C15849"
mpn = "CL10A105KB8NNNC"
nets = ["AVDD", "GND"]

[part.C4]   # ADC DECAP 1uF
device = "R0603"
lcsc = "C15849"
mpn = "CL10A105KB8NNNC"
nets = ["DECAP", "GND"]

[part.C5]   # ADC DVDD 1uF
device = "R0603"
lcsc = "C15849"
mpn = "CL10A105KB8NNNC"
nets = ["3V3", "GND"]

[part.C6]   # sensor 1 100nF
device = "R0603"
lcsc = "C14663"
mpn = "CC0603KRX7R9BB104"
nets = ["AVDD", "GND"]

[part.R5]   # 220R series
device = "R0603"
lcsc = "C22962"
mpn = "0603WAF2200T5E"
nets = ["OUT_K1", "AIN_K1"]

[part.C9]   # 10nF shunt at the ADC
device = "R0603"
lcsc = "C57112"
mpn = "0603B103K500NT"
nets = ["AIN_K1", "GND"]

[part.C7]   # sensor 2 100nF
device = "R0603"
lcsc = "C14663"
mpn = "CC0603KRX7R9BB104"
nets = ["AVDD", "GND"]

[part.R6]   # 220R series
device = "R0603"
lcsc = "C22962"
mpn = "0603WAF2200T5E"
nets = ["OUT_K2", "AIN_K2"]

[part.C10]   # 10nF shunt at the ADC
device = "R0603"
lcsc = "C57112"
mpn = "0603B103K500NT"
nets = ["AIN_K2", "GND"]

[part.C8]   # sensor 3 100nF
device = "R0603"
lcsc = "C14663"
mpn = "CC0603KRX7R9BB104"
nets = ["AVDD", "GND"]

[part.R7]   # 220R series
device = "R0603"
lcsc = "C22962"
mpn = "0603WAF2200T5E"
nets = ["OUT_K3", "AIN_K3"]

[part.C11]   # 10nF shunt at the ADC
device = "R0603"
lcsc = "C57112"
mpn = "0603B103K500NT"
nets = ["AIN_K3", "GND"]

[part.R3]   # 33R on SDO
device = "R0603"
lcsc = "C23140"
mpn = "0603WAF330JT5E"
nets = ["SDO", "MISO"]

[part.R4]   # 100k CS pull-up
device = "R0603"
lcsc = "C25803"
mpn = "0603WAF1003T5E"
nets = ["3V3", "CS"]

[part.R1]   # 100k
device = "R0603"
lcsc = "C25803"
mpn = "0603WAF1003T5E"
nets = ["3V3", "ID"]

[part.R2]   # 100k: 1.65 V
device = "R0603"
lcsc = "C25803"
mpn = "0603WAF1003T5E"
nets = ["ID", "GND"]

[part.C12]   # 100nF at the connector
device = "R0603"
lcsc = "C14663"
mpn = "CC0603KRX7R9BB104"
nets = ["3V3", "GND"]

