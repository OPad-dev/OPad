# The Windows programs link the C runtime statically: a clean Windows 10/11
# has no vcruntime140.dll (the Visual C++ Redistributable is not part of it),
# and opad-gui, opad-daemon and opadctl fail to start with 0xC0000135 where
# nothing else installed it. Found by the lab VMs (scripts/lab/lab-install.ps1).
# Applies to builds started from this directory or below (desktop/, build/).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
